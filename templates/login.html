<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f4ec;
            --card: #eef2f8;
            --text: #1b1d20;
            --muted: #60656f;
            --line: #d0d6e2;
            --brand: #d0562d;
            --soft: #eef2f8;
            --danger-bg: #fff3f3;
            --danger-line: #f2c8c9;
            --danger-text: #a31f23;
            --ok-bg: #eefaf3;
            --ok-line: #bbe9cd;
            --ok-text: #1d6f3a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Manrope", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 0%, #fff2d7 0, transparent 28%),
                radial-gradient(circle at 90% 10%, #ffe7dd 0, transparent 24%),
                var(--bg);
            min-height: 100vh;
        }

        .page {
            width: min(720px, 92vw);
            margin: 34px auto 48px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #2f3641;
            border: 1px solid var(--line);
            background: #fff;
            padding: 9px 12px;
            border-radius: 10px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--card);
            padding: 20px;
            display: grid;
            gap: 14px;
            animation: rise 0.24s ease both;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.4rem, 2.4vw, 1.95rem);
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 0.94rem;
        }

        .msg {
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.92rem;
            border: 1px solid;
        }

        .msg.error {
            background: var(--danger-bg);
            border-color: var(--danger-line);
            color: var(--danger-text);
        }

        form {
            display: grid;
            gap: 12px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        label {
            font-size: 0.83rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #2d333d;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            font: inherit;
            color: var(--text);
            background: var(--soft);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            border-color: #d68868;
            box-shadow: 0 0 0 3px rgba(208, 86, 45, 0.15);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn.primary {
            color: #fff;
            background: linear-gradient(135deg, #ea6f45, var(--brand));
        }

        .btn.google {
            color: #1e3a8a;
            border: 1px solid #d8e2ff;
            background: #f5f8ff;
        }

        .btn.ghost {
            color: #2f3641;
            border: 1px solid var(--line);
            background: #fff;
        }

        .or {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: 0.83rem;
            text-align: center;
            font-weight: 700;
        }

        .helper {
            color: var(--muted);
            font-size: 0.86rem;
            margin: 0;
        }

        .forgot-link {
            color: var(--brand);
            font-weight: 700;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .forgot-row {
            display: flex;
            justify-content: flex-end;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            .page { margin: 18px auto 28px; }
            .card { padding: 14px; }
            input { font-size: 16px; }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marketplace.css') }}">
</head>
<body>
    {% include "_navigation.html" %}
    <main class="page">
        <a class="back" href="{{ url_for('home') }}">⬅ Back to Listings</a>

        <section class="card">
            <h1>Login</h1>
            <p class="subtitle">Sign in to manage your listings.</p>

            {% include "_flash_messages.html" %}

            {% if error %}
                <div class="msg error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="next" value="{{ next }}">

                <div class="field">
                    <label for="phone">Phone Number</label>
                    <input id="phone" type="text" name="phone" value="{{ phone or '' }}" placeholder="e.g. 676210234" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" minlength="6" required>
                </div>

                <div class="forgot-row">
                    <a class="forgot-link" href="{{ url_for('forgot_password') }}">Forgot Password?</a>
                </div>

                <div class="actions">
                    <button class="btn primary" type="submit">Login</button>
                    <a class="btn ghost" href="{{ url_for('home') }}">Cancel</a>
                </div>
            </form>

            {% if google_oauth_enabled %}
                <p class="or">OR</p>
                <a class="btn google" href="{{ url_for('login_google', next=next) }}">
                    <svg width="20" height="20" viewBox="0 0 24 24" style="margin-right: 8px; flex-shrink: 0;" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a6.94 6.94 0 0 1-3.08 5.78v3.03l4.04-2.35c1.07-.62 1.84-1.73 2.2-3.02z"/>
                        <path fill="#34A853" d="M12 23.5c2.97 0 5.46-1.03 7.28-2.79l-4.04-2.35c-1.03.7-2.35 1.1-3.91 1.1-3 0-5.54-2-6.41-4.71H2.15v3.04C4.03 20.94 7.73 23.5 12 23.5z"/>
                        <path fill="#FBBC05" d="M5.59 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.03H2.14C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.97l3.41-2.88z"/>
                        <path fill="#EA4335" d="M12 4.75c1.7 0 3.22.58 4.42 1.73l3.33-3.33C17.45 1.18 14.97 0 12 0 7.73 0 4.03 2.57 2.14 6.5l3.45 2.88c.87-2.71 3.41-4.63 6.41-4.63z"/>
                    </svg>
                    Continue with Google
                </a>
            {% endif %}

            <p class="helper">New here? <a href="{{ url_for('register') }}">Create account</a></p>
        </section>
    </main>
</body>
</html>
